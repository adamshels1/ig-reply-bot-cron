name: poll-instagram
# Calls the Instagram reply bot poller (~every minute). GitHub runs the schedule every 5 min
# (sometimes later); each run polls 5 times with 55 s pauses.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Poll
        env:
          TOKEN: ${{ secrets.POLL_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            curl -s -o /dev/null -w "poll $i: %{http_code}\n" --max-time 70 \
              -H "x-admin-token: $TOKEN" https://ig-reply-bot-one.vercel.app/api/poll || true
            [ "$i" -lt 5 ] && sleep 55
          done
